name: Build PicUNO RP2040 Firmware

on:
  push:
    branches: [ picuno-support ]
    paths:
      - 'ports/rp2/boards/PICUNO_RP2040/**'
      - '.github/workflows/build-picuno.yml'
  workflow_dispatch:

jobs:
  build-micropython:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        df -h
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
        sudo tar xf arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz -C /opt/
        echo "/opt/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH
        rm arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
    
    - name: Install build dependencies
      run: sudo apt-get install -y cmake ninja-build
    
    - name: Build mpy-cross
      run: make -C mpy-cross
    
    - name: Fetch submodules
      run: |
        cd ports/rp2
        make BOARD=PICUNO_RP2040 submodules
    
    - name: Build firmware
      run: |
        cd ports/rp2
        make BOARD=PICUNO_RP2040 -j2
        ls -lh build-PICUNO_RP2040/
    
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: micropython-picuno-rp2040
        path: ports/rp2/build-PICUNO_RP2040/firmware.uf2
        if-no-files-found: error
